name: Android release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TOOLS: "36.0.0"

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;${{ env.BUILD_TOOLS }} platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest
      - name: Release lint
        run: ./gradlew --no-daemon lintRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/

  release:
    name: Signed release APK + AAB
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;${{ env.BUILD_TOOLS }} platform-tools"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode PKCS12 keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          KS="${RUNNER_TEMP}/release-keystore.p12"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KS}"
          chmod 600 "${KS}"
          echo "ANDROID_KEYSTORE_PATH=${KS}" >> "${GITHUB_ENV}"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify APK signature (apksigner)
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"
          APK=app/build/outputs/apk/release/app-release.apk
          "${APKSIGNER}" verify --verbose --print-certs "${APK}" | tee apksigner.txt
          if grep -qi "CN=Android Debug" apksigner.txt; then echo "::error::APK is signed with a debug certificate"; exit 1; fi
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt

      - name: Verify AAB signature (jarsigner) and signer identity
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          # The upload certificate is self-signed by design; check integrity and that the signer is our key.
          jarsigner -verify -strict -verbose -certs "${AAB}" > jarsigner.txt 2>&1 || {
            # -strict fails on self-signed certs; fall back to integrity-only verification.
            jarsigner -verify -verbose -certs "${AAB}" > jarsigner.txt 2>&1
          }
          grep -q "jar verified" jarsigner.txt
          if grep -qi "CN=Android Debug" jarsigner.txt; then echo "::error::AAB is signed with a debug certificate"; exit 1; fi
          EXPECTED=$(keytool -list -v -keystore "${ANDROID_KEYSTORE_PATH}" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "${ANDROID_KEY_ALIAS}" \
            | grep -m1 "SHA256:" | awk '{print $2}')
          ACTUAL=$(keytool -printcert -jarfile "${AAB}" | grep -m1 "SHA256:" | awk '{print $2}')
          echo "Expected signer SHA-256: ${EXPECTED}"
          echo "AAB signer SHA-256:      ${ACTUAL}"
          test -n "${EXPECTED}" && test "${EXPECTED}" = "${ACTUAL}"

      - name: Check release permissions
        run: |
          set -euo pipefail
          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt2"
          APK=app/build/outputs/apk/release/app-release.apk
          MERGED=$(find app/build/intermediates -path "*release*" -name AndroidManifest.xml -path "*merged_manifest*" | head -n1)
          echo "Merged manifest: ${MERGED}"
          "${AAPT2}" dump permissions "${APK}" | tee permissions.txt
          if grep -E "INTERNET|ACCESS_NETWORK_STATE" "${MERGED}" permissions.txt; then
            echo "::error::Prohibited network permission found"; exit 1
          fi
          # Only the AndroidX-generated, non-exported DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION is tolerated.
          if grep "uses-permission" permissions.txt | grep -v "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"; then
            echo "::error::Unexpected permission in packaged manifest"; exit 1
          fi

      - name: Inspect native libraries (16 KB page size)
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          APK_SO=$(unzip -Z1 "${APK}" | grep '\.so$' || true)
          AAB_SO=$(unzip -Z1 "${AAB}" | grep '\.so$' || true)
          if [ -z "${APK_SO}${AAB_SO}" ]; then
            echo "No native .so libraries packaged in APK or AAB: 16 KB ELF alignment not applicable."
          else
            echo "Native libraries found:"; echo "${APK_SO}"; echo "${AAB_SO}"
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign" -c -P 16 -v 4 "${APK}"
            mkdir -p so_check && unzip -o -q "${APK}" 'lib/*' -d so_check
            for so in $(find so_check -name '*.so'); do
              ALIGN=$(objdump -p "$so" | awk '/LOAD/ {print $NF}' | sort -u)
              echo "$so: $ALIGN"
              echo "$ALIGN" | grep -qvE '2\*\*(14|15|16)' && { echo "::error::$so is not 16 KB aligned"; exit 1; } || true
            done
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packpal-kids-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            apksigner.txt
            jarsigner.txt
            permissions.txt

      - name: Remove signing material
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-keystore.p12"
